name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a PR gets a new push. Main + tag runs are never
# cancelled — those represent landed history and must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only token scope; the release job opts in to `contents: write`.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run the three static checks concurrently — each takes ~10–15s on its
      # own and they don't share state, so doing them in parallel inside one
      # step saves ~20–30s of wall-clock vs. three sequential steps. Per-check
      # output is buffered to a log and replayed after `wait` so the GitHub UI
      # shows a clean, per-check block instead of interleaved lines. The exit
      # code is the bitwise-OR of all three so any failure surfaces, and the
      # log replay still runs on failure so you can see *why* it failed.
      - name: Lint + typecheck (main + renderer)
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1 & L=$!
          npm run typecheck > /tmp/typecheck.log 2>&1 & T=$!
          npm run typecheck:web > /tmp/typecheck-web.log 2>&1 & W=$!
          wait $L; LR=$?
          wait $T; TR=$?
          wait $W; WR=$?
          echo '::group::Lint'; cat /tmp/lint.log; echo "exit=$LR"; echo '::endgroup::'
          echo '::group::Typecheck (main)'; cat /tmp/typecheck.log; echo "exit=$TR"; echo '::endgroup::'
          echo '::group::Typecheck (renderer)'; cat /tmp/typecheck-web.log; echo "exit=$WR"; echo '::endgroup::'
          exit $(( LR | TR | WR ))

      - name: Unit tests
        run: npm test

  build:
    name: Compile renderer + main
    runs-on: ubuntu-latest
    # No `needs: verify` — compile runs in parallel with lint/typecheck/test so
    # a compile-only break surfaces at the same time as a lint break.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `compile` runs electron-vite without electron-builder packaging, which
      # avoids needing native dependencies (wine, rpm-tools) in CI. Packaging
      # runs on tagged commits only — see .github/workflows/release.yml.
      - name: Compile
        run: npm run compile
