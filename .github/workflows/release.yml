name: Release

on:
  push:
    tags: ['v*']

# Tag pushes need to write Releases to attach installers + auto-generated notes.
permissions:
  contents: write

jobs:
  # Even on a tag push we re-run the full verify gate first — if a tag points
  # at a broken commit, we should fail loudly before publishing installers.
  verify:
    name: Verify tag (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck (main + renderer)
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1 & L=$!
          npm run typecheck > /tmp/typecheck.log 2>&1 & T=$!
          npm run typecheck:web > /tmp/typecheck-web.log 2>&1 & W=$!
          wait $L; LR=$?
          wait $T; TR=$?
          wait $W; WR=$?
          echo '::group::Lint'; cat /tmp/lint.log; echo "exit=$LR"; echo '::endgroup::'
          echo '::group::Typecheck (main)'; cat /tmp/typecheck.log; echo "exit=$TR"; echo '::endgroup::'
          echo '::group::Typecheck (renderer)'; cat /tmp/typecheck-web.log; echo "exit=$WR"; echo '::endgroup::'
          exit $(( LR | TR | WR ))

      - name: Unit tests
        run: npm test

  # One runner per target OS so each installer is built natively — avoids the
  # wine fragility that ubuntu-only builds had, and lets macOS notarize once
  # I-BLD-05 wires the Developer ID cert. Each job uploads its artifacts to a
  # shared bucket; the `publish` job downloads everything and creates the
  # Release in one shot so release notes aren't raced across matrix entries.
  package:
    name: Package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          # Pinned to windows-2025 explicitly: `windows-latest` is being
          # redirected to the windows-2025 image, so pinning keeps the NSIS
          # packaging step on a known runner instead of tracking the moving
          # `latest` label (gh-actions #88).
          - os: windows-2025
            script: build:win
            artifacts: |
              dist/*.exe
          - os: macos-latest
            script: build:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --publish never: electron-builder auto-detects CI + tag and tries to
      # upload Releases itself, but we collect artifacts and let the publish
      # job attach them in a single step so release notes aren't raced.
      - name: Build installer
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      # generate_release_notes: true uses GitHub's auto-generator, which builds
      # categorized notes from merged PRs since the previous tag. Pair with a
      # .github/release.yml if we want to customize categories later.
      - name: Attach installers + changelog to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
