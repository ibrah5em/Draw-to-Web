appId: com.draw-to-web.app
productName: Draw to Web
copyright: Copyright © 2026
artifactName: ${name}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!tsconfig*.json'
  - '!.eslintrc.*'
  - '!.prettierrc'

# sharp ships prebuilt libvips binaries under `@img/sharp-*` and
# `@img/sharp-libvips-*` that must live outside the asar archive — the
# native loader dlopens them at runtime. lightningcss ships a per-arch
# `*.node` addon for the same reason; the export pipeline loads it from
# the main process during the `minify` stage (I-EXP-03).
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/lightningcss/**/*
  - node_modules/lightningcss-*/**/*

win:
  executableName: draw-to-web
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.graphics-design
  # `identity: null` disables auto-signing so unsigned local builds and
  # CI runs without a Developer ID cert succeed. I-BLD-05 will flip this
  # to a real identity (+ notarization) once certs are in place.
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  category: Graphics
  synopsis: Convert visual canvas layouts into clean, semantic HTML/CSS
  desktop:
    StartupWMClass: draw-to-web
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ${name}-${version}-${arch}.${ext}

deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  maintainer: Draw-to-Web Team <draw-to-web@example.com>
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
